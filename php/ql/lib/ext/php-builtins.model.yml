# PHP built-in functions as Models-as-Data.
#
# The ENGINE (how a call propagates, dispatches, mutates) lives in QL and is language-general. The
# COVERAGE — which built-in function is a source / sink / sanitizer / taint step — is DATA and lives
# here, so it is extended by adding rows, never by editing QL. Columns:
#   sourceModel    : subjectKind, name, sourceType
#   sinkModel      : subjectKind, name, argIndex(-1=any), vulnKind
#   stepModel      : subjectKind, name, fromArg(-1=any), toArg(-1=return)
#   sanitizerModel : subjectKind, name
# subjectKind is "function" for all built-ins below.

extensions:
  # ---- Sources: built-in request/environment readers ------------------------------------------
  - addsTo:
      pack: codeql/php-all
      extensible: sourceModel
    data:
      # NOTE: `getenv` is NOT a blanket source — `getenv('TEMP'/'PATH'/'HOME'/…)` are server-controlled.
      # A structural `GetenvSource` (FlowSources.qll) fires only for user-controllable names (`HTTP_*`,
      # request-derived) or a dynamic/absent key (conservative).
      - ["function", "apache_request_headers", "remote"]
      - ["function", "getallheaders", "remote"]
      - ["function", "filter_input", "remote"]
      - ["function", "filter_input_array", "remote"]

  # ---- Sinks: dangerous built-in functions (any argument) -------------------------------------
  - addsTo:
      pack: codeql/php-all
      extensible: sinkModel
    data:
      # command injection
      - ["function", "system", -1, "command injection"]
      - ["function", "exec", -1, "command injection"]
      - ["function", "shell_exec", -1, "command injection"]
      - ["function", "passthru", -1, "command injection"]
      - ["function", "proc_open", -1, "command injection"]
      - ["function", "popen", -1, "command injection"]
      # mail($to,$subj,$msg,$headers,$params) — the 5th arg (additional_parameters, index 4) is appended
      # to the sendmail command line, so a tainted value is OS command injection => RCE (the PHPMailer /
      # sendmail `-X`/`-f` class, e.g. CVE-2016-10033). Scoped to arg 4 (to/subject/headers are CRLF
      # header-injection, a different class).
      - ["function", "mail", 4, "command injection"]
      # code injection
      - ["function", "eval", -1, "code injection"]
      - ["function", "assert", -1, "code injection"]
      - ["function", "create_function", -1, "code injection"]
      # call_user_func($callable, …) / call_user_func_array — a user-controlled CALLABLE (arg 0) is an
      # arbitrary function call => RCE (e.g. call_user_func($_POST['callback'], …)). Scoped to arg 0
      # (the callable); a tainted argument in a constant-callable call is not this sink. Only fires when
      # the callable itself is tainted, so ordinary hook/dispatch usage (constant callables) is clean.
      - ["function", "call_user_func", 0, "code injection"]
      - ["function", "call_user_func_array", 0, "code injection"]
      # SQL injection
      - ["function", "mysqli_query", -1, "SQL injection"]
      - ["function", "mysql_query", -1, "SQL injection"]
      - ["function", "pg_query", -1, "SQL injection"]
      - ["function", "pg_send_query", -1, "SQL injection"]
      # reflected XSS
      - ["function", "print", -1, "reflected XSS"]
      - ["function", "printf", -1, "reflected XSS"]
      - ["function", "print_r", -1, "reflected XSS"]
      - ["function", "vprintf", -1, "reflected XSS"]
      # user error message is echoed to the page when display_errors is on
      - ["function", "trigger_error", 0, "reflected XSS"]
      - ["function", "user_error", 0, "reflected XSS"]
      # path traversal
      - ["function", "fopen", -1, "path traversal"]
      - ["function", "file_get_contents", -1, "path traversal"]
      - ["function", "file_put_contents", -1, "path traversal"]
      - ["function", "readfile", -1, "path traversal"]
      - ["function", "file", -1, "path traversal"]
      - ["function", "unlink", -1, "path traversal"]
      # NB: fwrite($handle, $data) / fputs are NOT path sinks — arg 0 is a resource (file OR SOCKET) and
      # arg 1 is the written data; the path decision already lives at the fopen() sink above. Modelling
      # fwrite here flagged socket writes (fwrite(fsockopen(), $x) — email_verify) and echoed-data as
      # "path traversal". No corpus positive relies on fwrite (fopen covers the real write-path chain).
      # move_uploaded_file($tmp, $dest) — the canonical upload sink. The DESTINATION (arg 1) decides
      # where (and under what name/extension) the upload lands; an attacker-controlled destination is
      # arbitrary file write => webshell/RCE. arg 0 is the server-set temp path, so scope to arg 1.
      - ["function", "move_uploaded_file", 1, "path traversal"]
      - ["function", "copy", -1, "path traversal"]
      - ["function", "rename", -1, "path traversal"]
      - ["function", "mkdir", -1, "path traversal"]
      - ["function", "rmdir", -1, "path traversal"]
      - ["function", "scandir", -1, "path traversal"]
      - ["function", "opendir", -1, "path traversal"]
      # hash_file(algo, FILENAME): only arg 1 is the path (arg 0 is the algorithm string).
      - ["function", "hash_file", 1, "path traversal"]
      # ---- Blind file read via PHP filter chains (error-based oracle, per Synacktiv). These primitives
      # take a user-controlled path that PHP resolves through stream wrappers (`php://filter/...`), so an
      # arbitrary local file can be read even though the function returns only a hash / metadata / no
      # displayed content — hence NOT classic path traversal. See `file read` sinks below.
      - ["function", "md5_file", 0, "file read"]
      - ["function", "sha1_file", 0, "file read"]
      - ["function", "crc32_file", 0, "file read"]
      - ["function", "hash_file", 1, "file read"]
      - ["function", "getimagesize", 0, "file read"]
      - ["function", "mime_content_type", 0, "file read"]
      - ["function", "exif_read_data", 0, "file read"]
      - ["function", "exif_imagetype", 0, "file read"]
      - ["function", "exif_thumbnail", 0, "file read"]
      - ["function", "finfo_file", 1, "file read"]        # finfo_file($finfo, FILENAME)
      - ["function", "parse_ini_file", 0, "file read"]
      - ["function", "gzfile", 0, "file read"]
      - ["function", "readgzfile", 0, "file read"]
      - ["function", "highlight_file", 0, "file read"]
      - ["function", "show_source", 0, "file read"]
      # the content-displaying readers below are ALSO filter-chain sinks; they already appear as path
      # traversal above, but list them here too so the dedicated file-read query reports them.
      - ["function", "file_get_contents", 0, "file read"]
      - ["function", "readfile", 0, "file read"]
      - ["function", "file", 0, "file read"]
      - ["function", "fopen", 0, "file read"]
      - ["function", "copy", 0, "file read"]
      # open redirect
      # NOTE: `header()` is an open-redirect sink ONLY for a `Location:` header — modelled
      # structurally in FlowSources (a blanket arg row also flagged `header('X-Foo: '.$x)`).
      - ["function", "http_redirect", -1, "open redirect"]
      # server-side request forgery
      - ["function", "curl_setopt", -1, "server-side request forgery"]
      - ["function", "curl_init", -1, "server-side request forgery"]
      - ["function", "fsockopen", -1, "server-side request forgery"]
      - ["function", "stream_socket_client", -1, "server-side request forgery"]
      - ["function", "get_headers", -1, "server-side request forgery"]
      # LDAP injection — modeled precisely (correct arg indices + lowercase kind) in
      # ldap-injection.model.yml; these bare `-1` "LDAP injection" (wrong-case kind) rows were dead.
      # XPath injection: SimpleXMLElement::xpath($expr) — `xpath` is a distinctive method name, so
      # matching by name is precise. (DOMXPath::query/evaluate use generic names -> typed sinks below.)
      - ["method", "xpath", -1, "xpath injection"]
      # unsafe deserialization
      - ["function", "unserialize", 0, "unsafe deserialization"]   # arg0 only; arg1 is the (safe) options array

  # ---- Sanitizers: built-in encoders / escapers / validators (value-returning) ----------------
  - addsTo:
      pack: codeql/php-all
      extensible: sanitizerModel
    data:
      # NB: htmlspecialchars/htmlentities/strip_tags are HTML-context escapers — moved to
      # weakXssSanitizerModel + stepModel below (barrier for XSS, but carry taint to SQL/path/command,
      # so escape-then-SQLi is not hidden). The WordPress esc_html/esc_attr/esc_url/esc_js/sanitize_email/
      # wp_kses[_post] escapers are modeled (correctly split) in wordpress.model.yml — declaring them as
      # FULL sanitizers here would OVERRIDE that split (full sanitizer wins) and re-hide escape-then-SQLi.
      # NB: escapeshellarg/escapeshellcmd (COMMAND-context) and basename/realpath (PATH-context) moved to the
      # kindSanitizerModel blocks below — a shell escaper must not barrier SQL/XSS, and basename() removing
      # `../` does not stop `system("… ".basename($x))` command injection.
      # NB: the SQL escapers (mysqli/mysql_real_escape_string, pg_escape_*, addslashes) moved to the
      # kindSanitizerModel("SQL injection") block below — they escape SQL quotes but leave <>/shell
      # metacharacters, so they must NOT barrier XSS/command/path.
      - ["function", "intval"]
      - ["function", "floatval"]
      - ["function", "doubleval"]
      - ["function", "abs"]
      - ["function", "count"]
      # NB: `settype` removed — it returns bool and mutates its arg BY REFERENCE, so a sanitizerModel row
      # (which barriers the bool RETURN, not the value) sanitizes nothing. Handled by SettypeBarrier in QL.
      # NB: filter_var is NOT a blanket sanitizer — FILTER_VALIDATE_URL/EMAIL/IP return the input UNCHANGED
      # (validation only -> SSRF/injection FN) and FILTER_DEFAULT/UNSAFE_RAW is a no-op. It is a taint STEP
      # below; only the genuinely-neutralizing numeric filters barrier (FilterVarNumericBarrier in QL).
      # NB: preg_quote is a REGEX-context escaper (escapes . \ + * ? [ ^ ] $ ( ) { } = ! < > | : - # and an
      # optional delimiter) — it does NOT escape quotes, semicolons or angle brackets, so it is NOT a
      # barrier for SQL/command/XSS. Modeled as a taint STEP below, not a sanitizer.
      - ["function", "urlencode"]
      - ["function", "rawurlencode"]
      - ["function", "base64_encode"]
      - ["function", "bin2hex"]
      - ["function", "md5"]
      - ["function", "sha1"]
      - ["function", "hash"]
      # NB: the method SQL escapers (quote/escape/real_escape_string on a driver handle) moved to the
      # kindSanitizerModel("SQL injection") block below (SQL-context only, and they no longer over-shadow the
      # class-scoped typedSanitizerModel rows for the same names).

  # ---- SQL-context escapers: barrier the SQL query ONLY (not XSS/command/path) --------------------------
  # `real_escape_string`/`addslashes`/`quote`/`escape` escape SQL quotes but leave `<>`/`;`/`|`/`../` intact,
  # so `echo $mysqli->real_escape_string($x)` (XSS) and `system(addslashes($x))` (command) must still fire.
  - addsTo: { pack: codeql/php-all, extensible: kindSanitizerModel }
    data:
      - ["function", "mysqli_real_escape_string", "SQL injection"]
      - ["function", "mysql_real_escape_string", "SQL injection"]
      - ["function", "pg_escape_string", "SQL injection"]
      - ["function", "pg_escape_literal", "SQL injection"]
      - ["function", "addslashes", "SQL injection"]
      - ["method", "quote", "SQL injection"]              # $pdo->quote($x)
      - ["method", "escape", "SQL injection"]             # $db->escape($x)
      - ["method", "real_escape_string", "SQL injection"] # $mysqli->real_escape_string($x)
      # COMMAND-context: escapeshellarg/escapeshellcmd neutralise shell metacharacters, NOT SQL/XSS/path.
      - ["function", "escapeshellarg", "command injection"]
      - ["function", "escapeshellcmd", "command injection"]
      # PATH-context: basename/realpath strip `../`, barriering traversal / file-read / file-inclusion, but
      # leave shell/SQL/HTML metacharacters (`system("… ".basename($x))` still injects).
      - ["function", "basename", "path traversal"]
      - ["function", "basename", "file read"]
      - ["function", "basename", "file inclusion"]
      - ["function", "realpath", "path traversal"]
      - ["function", "realpath", "file read"]
      - ["function", "realpath", "file inclusion"]

  # ---- HTML-context escapers: a barrier for XSS only, NOT for SQL/path/command --------------------
  # htmlspecialchars/htmlentities encode < > & " (' with ENT_QUOTES) for HTML/attribute context; strip_tags
  # removes tags. None neutralise SQL metacharacters () , space -- or a shell ; | & — so modelling them as
  # FULL sanitizers hides escape-then-SQLi / escape-then-command (e.g. htmlspecialchars($x) concatenated into
  # a query). Weak-XSS barrier + a carry-taint step (same pattern as WordPress esc_html/esc_attr).
  - addsTo: { pack: codeql/php-all, extensible: weakXssSanitizerModel }
    data:
      - ["function", "htmlspecialchars"]
      - ["function", "htmlentities"]
      - ["function", "strip_tags"]

  # ---- Sanitizer GUARDS: validators used as `if (g($x)) { …safe… }` branch conditions ----------
  - addsTo:
      pack: codeql/php-all
      extensible: sanitizerGuardModel
    data:
      - ["ctype_alnum"]
      - ["ctype_digit"]
      - ["ctype_alpha"]
      - ["ctype_xdigit"]
      - ["ctype_upper"]
      - ["ctype_lower"]
      - ["is_numeric"]
      - ["is_int"]
      - ["is_integer"]
      - ["is_float"]
      - ["is_double"]
      - ["in_array"]
      - ["array_key_exists"]
      - ["preg_match"]
      # `method_exists($obj, $name)` bounds a subsequent dynamic method call `$obj->$name()` to the
      # DECLARED methods of a concrete object — i.e. not arbitrary code execution. This is the standard
      # guarded-dispatch idiom (`if (method_exists($o,$m)) { $o->$m(...); }`); without it the
      # code-injection query reports every such call as RCE (the dominant dynamic-dispatch FP class:
      # er24-rechtstexte, t3-cat-search, femanager setters, …). NOT is_callable/function_exists — those
      # are true for `system`/`exec`, so they do not bound the callee.
      - ["method_exists"]

  # ---- Taint steps: string built-ins that propagate any argument to the result ----------------
  - addsTo:
      pack: codeql/php-all
      extensible: stepModel
    data:
      # Exception message accessor: `$e->getMessage()` returns the message the exception carries
      # (receiver -> return). Paired with the `new *Exception($msg)` message step in TaintTrackingPrivate.
      - ["method", "getMessage", -2, -1]
      - ["function", "strtoupper", -1, -1]
      # SQL escapers are kind-scoped sanitizers (kindSanitizerModel "SQL injection" above) — they must CARRY
      # taint (arg -> return) so the escaped value still reaches an XSS/command/path sink (the SQL query is
      # barriered by KindSanitizer; these steps re-arm the OTHER kinds). Same pattern as weak-XSS + step.
      - ["function", "mysqli_real_escape_string", -1, -1]
      - ["function", "mysql_real_escape_string", -1, -1]
      - ["function", "pg_escape_string", -1, -1]
      - ["function", "pg_escape_literal", -1, -1]
      - ["function", "addslashes", -1, -1]
      - ["method", "quote", -1, -1]              # $pdo->quote / Connection::quote / Mysql::quote / …
      - ["method", "escape", -1, -1]             # $db->escape / Db::escape / DatabaseDriver::escape
      - ["method", "real_escape_string", -1, -1]
      - ["method", "quoteName", -1, -1]
      - ["method", "quoteInto", -1, -1]
      - ["method", "quoteIdentifier", -1, -1]
      - ["method", "quoteIdentifiers", -1, -1]
      # shell + path escapers: kind-scoped sanitizers -> carry taint to the OTHER-kind sinks (paired step).
      - ["function", "escapeshellarg", -1, -1]
      - ["function", "escapeshellcmd", -1, -1]
      - ["function", "basename", -1, -1]
      - ["function", "realpath", -1, -1]
      # HTML-context escapers + preg_quote carry taint (arg 0 -> return) so a downstream SQL/path/command
      # sink is still reached (they are weak-XSS barriers / non-sanitizers for those kinds — see above).
      - ["function", "htmlspecialchars", 0, -1]
      - ["function", "htmlentities", 0, -1]
      - ["function", "strip_tags", 0, -1]
      - ["function", "preg_quote", 0, -1]
      - ["function", "filter_var", 0, -1]     # carries taint; numeric-filter barrier is FilterVarNumericBarrier
      - ["function", "strtolower", -1, -1]
      - ["function", "ucfirst", -1, -1]
      - ["function", "ucwords", -1, -1]
      - ["function", "lcfirst", -1, -1]
      - ["function", "trim", -1, -1]
      - ["function", "ltrim", -1, -1]
      - ["function", "rtrim", -1, -1]
      - ["function", "substr", -1, -1]
      - ["function", "str_replace", -1, -1]
      - ["function", "str_ireplace", -1, -1]
      - ["function", "preg_replace", -1, -1]
      - ["function", "preg_replace_callback", -1, -1]
      - ["function", "sprintf", -1, -1]
      - ["function", "vsprintf", -1, -1]
      - ["function", "implode", -1, -1]
      - ["function", "join", -1, -1]
      - ["function", "strrev", -1, -1]
      - ["function", "str_repeat", -1, -1]
      - ["function", "str_pad", -1, -1]
      - ["function", "substr_replace", -1, -1]
      - ["function", "strtr", -1, -1]
      - ["function", "chunk_split", -1, -1]
      - ["function", "nl2br", -1, -1]
      - ["function", "wordwrap", -1, -1]
      - ["function", "strval", -1, -1]
      - ["function", "urldecode", -1, -1]
      - ["function", "rawurldecode", -1, -1]
      - ["function", "base64_decode", -1, -1]
      - ["function", "json_decode", -1, -1]
      - ["function", "unserialize", -1, -1]
      - ["function", "stripslashes", -1, -1]
      - ["function", "stripcslashes", -1, -1]
      - ["function", "html_entity_decode", -1, -1]
      - ["function", "htmlspecialchars_decode", -1, -1]
      - ["function", "utf8_decode", -1, -1]
      - ["function", "utf8_encode", -1, -1]
      - ["function", "hex2bin", -1, -1]
      - ["function", "quotemeta", -1, -1]
      # Multibyte / encoding / search string transforms (ubiquitous in i18n + CMS) — the string argument
      # flows to the result; without these, taint drops through a mb_*/iconv/strstr rewrite (FN).
      - ["function", "mb_substr", -1, -1]
      - ["function", "mb_strtolower", -1, -1]
      - ["function", "mb_strtoupper", -1, -1]
      - ["function", "mb_convert_case", -1, -1]
      - ["function", "mb_convert_encoding", -1, -1]
      - ["function", "iconv", -1, -1]
      - ["function", "strstr", -1, -1]
      - ["function", "stristr", -1, -1]
      - ["function", "strrchr", -1, -1]
      - ["function", "preg_filter", -1, -1]
      # Array higher-order: the data array (any argument) flows to the result. The callback transforms
      # each element; taint is preserved regardless of callback kind (string / variable / inline).
      - ["function", "array_map", -1, -1]
      - ["function", "array_filter", -1, -1]
      # NB: array_walk removed — it returns a BOOLEAN (true) and mutates the array BY REFERENCE; a -1,-1
      # return step taints the constant `true` (unsound). The by-ref mutation is modeled below ([array_walk,1,0]).
      - ["function", "array_reduce", -1, -1]
      # String -> array splitters: each part carries the input's taint.
      - ["function", "explode", -1, -1]
      - ["function", "str_split", -1, -1]
      - ["function", "mb_str_split", -1, -1]
      - ["function", "preg_split", -1, -1]
      - ["function", "str_getcsv", -1, -1]
      # Array transforms that preserve element taint (data -> result).
      - ["function", "array_values", -1, -1]
      - ["function", "array_keys", -1, -1]
      - ["function", "array_merge", -1, -1]
      - ["function", "array_merge_recursive", -1, -1]
      - ["function", "array_replace", -1, -1]
      - ["function", "array_slice", -1, -1]
      - ["function", "array_splice", -1, -1]
      - ["function", "array_reverse", -1, -1]
      - ["function", "array_unique", -1, -1]
      - ["function", "array_flip", -1, -1]
      - ["function", "array_pad", -1, -1]
      - ["function", "array_fill", -1, -1]
      - ["function", "array_combine", -1, -1]
      - ["function", "array_column", -1, -1]
      - ["function", "array_chunk", -1, -1]
      - ["function", "array_diff", -1, -1]
      - ["function", "array_intersect", -1, -1]
      - ["function", "compact", -1, -1]
      - ["function", "current", -1, -1]
      - ["function", "reset", -1, -1]
      - ["function", "end", -1, -1]
      - ["function", "array_shift", -1, -1]
      - ["function", "array_pop", -1, -1]

  # ---- Higher-order callbacks: which arg is the callable, and where the data begins --------------
  - addsTo:
      pack: codeql/php-all
      extensible: callbackModel
    data:
      - ["call_user_func", 0, 1]
      - ["call_user_func_array", 0, 1]
      - ["array_map", 0, 1]
      - ["register_shutdown_function", 0, 1]
      - ["array_walk", 1, 0]
      - ["array_walk_recursive", 1, 0]
      - ["array_filter", 1, 0]
      - ["array_reduce", 1, 0]
      - ["usort", 1, 0]
      - ["uasort", 1, 0]
      - ["uksort", 1, 0]
      - ["preg_replace_callback", 1, 2]

  # ---- By-reference output writers: taint a &$out argument from an input argument ---------------
  - addsTo:
      pack: codeql/php-all
      extensible: outRefModel
    data:
      - ["parse_str", 0, 1]         # parse_str($tainted, $out)
      - ["mb_parse_str", 0, 1]
      - ["preg_match", 1, 2]        # preg_match($pat, $subj, $matches) — $matches from $subj
      - ["preg_match_all", 1, 2]
      - ["sscanf", 0, 2]            # sscanf($str, $fmt, &$out)

  # ---- Typed method sinks: file-reading methods on built-in classes (filter-chain file read) --------
  - addsTo:
      pack: codeql/php-all
      extensible: typedSinkModel
    data:
      - ["finfo", "file", 0, "file read"]               # (new finfo())->file($path)
      - ["SplFileObject", "__construct", 0, "file read"]
      - ["SplFileInfo", "__construct", 0, "file read"]
      - ["SplFileInfo", "openFile", 0, "file read"]
      # XPath injection: DOMXPath::query/evaluate take the XPath expression at arg 0. `query`/`evaluate`
      # are generic names, so scope to the DOMXPath class (SimpleXMLElement::xpath is by-name above).
      - ["DOMXPath", "query", 0, "xpath injection"]
      - ["DOMXPath", "evaluate", 0, "xpath injection"]

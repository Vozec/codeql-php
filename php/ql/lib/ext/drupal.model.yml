# Drupal Models-as-Data (Drupal 7 procedural + Drupal 8/9/10 OO, which is Symfony-HttpFoundation based).
#
# Adapting the analyser to Drupal is purely data — request accessors are sources, `db_query` / the DBTNG
# `Connection::query` are SQL sinks, `drupal_goto` / RedirectResponse are redirect sinks, and the
# `check_plain` / `filter_xss` / `Html::escape` / `Xss::filter` helpers are sanitizers. The engine
# (dispatch, flow) is language-general QL; only these names are Drupal-specific.
extensions:
  # ---- Sources: request input -------------------------------------------------------------------
  - addsTo: { pack: codeql/php-all, extensible: sourceModel }
    data:
      - ["function", "arg", "drupal-request"]                  # Drupal 7 `arg(0)` — a URL path component
  # Typed form sources (Drupal 8+): generic method names, so class-scoped for precision.
  - addsTo: { pack: codeql/php-all, extensible: typedSourceModel }
    data:
      # $form_state->getValue('x') / getValues() / getUserInput() — user-submitted form data.
      - ["FormStateInterface", "getValue", "remote"]
      - ["FormStateInterface", "getValues", "remote"]
      - ["FormStateInterface", "getUserInput", "remote"]
      - ["FormState", "getValue", "remote"]
      - ["FormState", "getValues", "remote"]
      - ["FormState", "getUserInput", "remote"]

  # ---- Sinks: raw SQL, redirects ----------------------------------------------------------------
  - addsTo: { pack: codeql/php-all, extensible: sinkModel }
    data:
      # Drupal 7 database API (D7-only — removed from D8+ core) — the query string (arg 0) is raw SQL.
      - ["function", "db_query", 0, "SQL injection"]
      - ["function", "db_query_range", 0, "SQL injection"]
      # (db_queryd removed — never a real public Drupal API.)
      # Drupal 7 redirect: drupal_goto($path). (D7-only.)
      - ["function", "drupal_goto", 0, "open redirect"]
      # Drupal 7 remote fetch with no host validation — SSRF (D7-only).
      - ["function", "system_retrieve_file", 0, "server-side request forgery"]
      - ["function", "drupal_http_request", 0, "server-side request forgery"]
  - addsTo: { pack: codeql/php-all, extensible: typedSinkModel }
    data:
      # Drupal 8+ DBTNG: `\Drupal::database()->query($sql)` / a Connection::query — raw SQL at arg 0.
      - ["Connection", "query", 0, "SQL injection"]
      - ["Connection", "queryRange", 0, "SQL injection"]
      - ["Connection", "queryTemporary", 0, "SQL injection"]
      # RedirectResponse (Symfony, used by Drupal) — the destination URL.
      - ["RedirectResponse", "__construct", 0, "open redirect"]
      - ["TrustedRedirectResponse", "__construct", 0, "open redirect"]
      # XSS: wrapping a string in Markup::create()/SafeMarkup::set()/format() marks it **safe HTML**,
      # so tainted data flowed in renders unescaped via a render array `#markup` / Twig `|raw`.
      # Class-scoped (typed) so the generic names `create`/`set`/`format` stay precise to Drupal.
      - ["Markup", "create", 0, "reflected xss"]
      - ["FormattableMarkup", "__construct", 0, "reflected xss"]
      - ["SafeMarkup", "set", 0, "reflected xss"]
      # D8-12 SSRF: \Drupal::httpClient() is a Guzzle client (replaces D7 drupal_http_request). URL arg.
      # Caveat: Guzzle's runtime class Client/ClientInterface is a generic name — watch FP rate.
      - ["Client", "request", 1, "server-side request forgery"]   # Client::request($method, $uri)
      - ["Client", "get", 0, "server-side request forgery"]
      - ["Client", "post", 0, "server-side request forgery"]
      - ["Client", "head", 0, "server-side request forgery"]
      - ["ClientInterface", "request", 1, "server-side request forgery"]

  # ---- Sanitizers: Drupal escaping / filtering helpers ------------------------------------------
  # Identifier escapers only: they wrap the value in the identifier-quote char, neutralising SQL
  # identifier injection (ORDER BY / table). These are genuinely SQL-context barriers -> full sanitizer.
  - addsTo: { pack: codeql/php-all, extensible: sanitizerModel }
    data:
      - ["method", "escapeField"]                             # Connection::escapeField — identifier escape (ORDER BY)
      - ["method", "escapeTable"]                             # Connection::escapeTable — identifier escape (table)
  # HTML/URL/XSS-context escapers: neutralise HTML output but NOT SQL/path/command -> weak-XSS + carry
  # taint (esc_html pattern), so an escape-then-SQLi flow is still caught rather than hidden.
  # escapeLike escapes ONLY the LIKE wildcards % _ \ (not quotes), so a value concatenated into a LIKE
  # clause is still SQLi -> it must CARRY taint (step), never a full barrier (WooCommerce esc_like pattern).
  - addsTo: { pack: codeql/php-all, extensible: weakXssSanitizerModel }
    data:
      - ["function", "check_plain"]                           # D7 HTML-escape
      - ["function", "check_url"]                             # D7 URL sanitiser
      - ["function", "filter_xss"]                            # D7 XSS filter
      - ["function", "filter_xss_admin"]
      - ["staticmethod", "checkPlain"]                        # SafeMarkup::checkPlain (D8)
      - ["staticmethod", "escape"]                            # Html::escape — D8+ HTML-escape
      - ["staticmethod", "escapeAttribute"]                   # Html::escapeAttribute
      - ["staticmethod", "filterAdmin"]                       # Xss::filterAdmin
      - ["staticmethod", "filter"]                            # Xss::filter
  - addsTo: { pack: codeql/php-all, extensible: stepModel }
    data:
      - ["function", "check_plain", 0, -1]
      - ["function", "check_url", 0, -1]
      - ["function", "filter_xss", 0, -1]
      - ["function", "filter_xss_admin", 0, -1]
      - ["staticmethod", "checkPlain", 0, -1]
      - ["staticmethod", "escape", 0, -1]
      - ["staticmethod", "escapeAttribute", 0, -1]
      - ["staticmethod", "filterAdmin", 0, -1]
      - ["staticmethod", "filter", 0, -1]
      - ["method", "escapeLike", 0, -1]                       # LIKE-wildcard escaper — carry taint, not a barrier

# Textpattern core Models-as-Data. Procedural: input via gps()/ps() global funcs (txplib_misc.php),
# SQL via safe_query()/safe_*() (txplib_db.php), SQL-escape via doSlash()/safe_escape().
extensions:
  # ---- Sources: gps() (GET/POST) family — only deCRLF/deNull applied, NOT SQL/HTML-safe -----------
  - addsTo: { pack: codeql/php-all, extensible: sourceModel }
    data:
      - ["function", "gps", "txp-request"]    # txplib_misc.php:946 $_GET/$_POST
      - ["function", "gpsa", "txp-request"]   # :981 map of gps()
      - ["function", "ps", "txp-request"]     # :1011 $_POST
      - ["function", "psa", "txp-request"]    # :1030
      - ["function", "psas", "txp-request"]   # :1048

  # ---- SQL sinks: safe_query raw + safe_* $where args (txplib_db.php) -----------------------------
  - addsTo: { pack: codeql/php-all, extensible: sinkModel }
    data:
      - ["function", "safe_query", 0, "SQL injection"]    # :424 raw SQL
      - ["function", "safe_field", 2, "SQL injection"]    # :925 $where
      - ["function", "safe_column", 2, "SQL injection"]   # :950 $where
      - ["function", "safe_row", 2, "SQL injection"]      # :1024 $where
      - ["function", "safe_rows", 2, "SQL injection"]     # :1059 $where
      - ["function", "safe_delete", 1, "SQL injection"]   # :488 $where
      - ["function", "safe_update", 1, "SQL injection"]   # :510 $set
      - ["function", "safe_update", 2, "SQL injection"]   # :510 $where

  # ---- Sanitizers: SQL-escape only (do NOT clear redirect/path/SSRF) -----------------------------
  - addsTo: { pack: codeql/php-all, extensible: sanitizerModel }
    data:
      - ["function", "doSlash"]        # doArray($in,'safe_escape') (:157)
      - ["function", "safe_escape"]    # mysqli_real_escape_string wrapper (:383)
  - addsTo: { pack: codeql/php-all, extensible: weakXssSanitizerModel }
    data:
      - ["function", "txpspecialchars"]   # :191 htmlspecialchars wrapper (XSS-only)
      - ["function", "escape_title"]      # :259

  # ---- Access-control: privilege gates ----------------------------------------------------------
  - addsTo: { pack: codeql/php-all, extensible: authorizationGuardModel }
    data:
      - ["function", "has_privs"]       # :472 boolean privilege check
      - ["function", "require_privs"]   # :589 hard-exit privilege gate
